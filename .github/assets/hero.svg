<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TrustLens. AI that reads a contract's real code. A raw scanner says DANGEROUS 71. TrustLens says CAUTION 25, canonical USDC whose admin can upgrade it.">
  <defs>
    <linearGradient id="tl-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6E9"/>
      <stop offset="0.5" stop-color="#FFE7EE"/>
      <stop offset="1" stop-color="#E8F4FF"/>
    </linearGradient>
    <linearGradient id="tl-safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD23F"/>
      <stop offset="1" stop-color="#3FCF8E"/>
    </linearGradient>
    <linearGradient id="tl-pop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4B5C"/>
      <stop offset="1" stop-color="#FFD23F"/>
    </linearGradient>
    <filter id="tl-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="tl-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3E2230" flood-opacity="0.14"/>
    </filter>
    <clipPath id="tl-round"><rect x="0" y="0" width="1280" height="360" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#tl-round)">
    <rect x="0" y="0" width="1280" height="360" fill="url(#tl-ground)"/>
    <circle cx="150" cy="70" r="150" fill="#FFD23F" opacity="0.45" filter="url(#tl-blur)"/>
    <circle cx="1140" cy="330" r="170" fill="#FF4B5C" opacity="0.30" filter="url(#tl-blur)"/>
    <circle cx="700" cy="320" r="150" fill="#BFE3FF" opacity="0.55" filter="url(#tl-blur)"/>
    <circle cx="1080" cy="40" r="120" fill="#FFC7D3" opacity="0.5" filter="url(#tl-blur)"/>

    <g transform="translate(96,96)" filter="url(#tl-soft)">
      <circle cx="0" cy="0" r="34" fill="url(#tl-pop)"/>
      <path d="M0,-34 A34 34 0 0 1 0,34 A17 17 0 0 1 0,0 A9 9 0 0 0 0,-18 A26 26 0 0 0 0,-34 Z" fill="#FFF6E9" opacity="0.9"/>
      <rect x="-4" y="30" width="8" height="46" rx="4" fill="#FFFFFF" opacity="0.85" stroke="#3E2230" stroke-opacity="0.12"/>
      <circle cx="-11" cy="-11" r="6" fill="#FFFFFF" opacity="0.7"/>
    </g>

    <text x="150" y="112" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#3E2230">TrustLens</text>

    <text x="98" y="196" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="700" fill="#3E2230">AI that reads a contract's real code and</text>
    <text x="98" y="234" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="700" fill="#3E2230">tells you what's <tspan fill="#FF4B5C">actually</tspan> safe.</text>

    <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700">
      <rect x="98" y="270" width="132" height="34" rx="17" fill="#FFFFFF" opacity="0.7" stroke="#3E2230" stroke-opacity="0.1"/>
      <text x="164" y="292" text-anchor="middle" fill="#3E2230">Live on Base</text>
      <rect x="240" y="270" width="120" height="34" rx="17" fill="#FFD23F" opacity="0.85"/>
      <text x="300" y="292" text-anchor="middle" fill="#3E2230">Free beta</text>
      <rect x="370" y="270" width="150" height="34" rx="17" fill="#FFFFFF" opacity="0.7" stroke="#3E2230" stroke-opacity="0.1"/>
      <text x="445" y="292" text-anchor="middle" fill="#3E2230">Copy-paste fixes</text>
    </g>

    <g filter="url(#tl-soft)">
      <rect x="765" y="86" width="185" height="200" rx="24" fill="#FFFFFF" opacity="0.72"/>
    </g>
    <rect x="765" y="86" width="185" height="200" rx="24" fill="none" stroke="#FF4B5C" stroke-opacity="0.35"/>
    <text x="857" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#FF4B5C">RAW FLAGS</text>
    <path d="M813,190 A44 44 0 0 1 901,190" fill="none" stroke="#F2D9DE" stroke-width="12" stroke-linecap="round"/>
    <path d="M813,190 A44 44 0 0 1 884.0,155.2" fill="none" stroke="#FF4B5C" stroke-width="12" stroke-linecap="round"/>
    <text x="857" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="38" font-weight="800" fill="#3E2230">71</text>
    <text x="857" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#3E2230" opacity="0.55">/100 risk</text>
    <rect x="792" y="232" width="130" height="34" rx="17" fill="#FF4B5C"/>
    <text x="857" y="254" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#FFF6E9">DANGEROUS</text>

    <g transform="translate(985,186)">
      <text x="0" y="-14" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="0.5" fill="#3E2230" opacity="0.6">READS THE</text>
      <text x="0" y="0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="0.5" fill="#3E2230" opacity="0.6">REAL CODE</text>
      <path d="M-22,16 H16 M6,7 L18,16 L6,25" fill="none" stroke="#3E2230" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g filter="url(#tl-soft)">
      <rect x="1035" y="86" width="185" height="200" rx="24" fill="#FFFFFF" opacity="0.82"/>
    </g>
    <rect x="1035" y="86" width="185" height="200" rx="24" fill="none" stroke="#3FCF8E" stroke-opacity="0.5"/>
    <text x="1127" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#2FA76F">TRUSTLENS</text>
    <path d="M1083,190 A44 44 0 0 1 1171,190" fill="none" stroke="#E4F3EC" stroke-width="12" stroke-linecap="round"/>
    <path d="M1083,190 A44 44 0 0 1 1095.9,158.9" fill="none" stroke="url(#tl-safe)" stroke-width="12" stroke-linecap="round"/>
    <text x="1127" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="38" font-weight="800" fill="#3E2230">25</text>
    <text x="1127" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#3E2230" opacity="0.55">/100 risk</text>
    <rect x="1062" y="232" width="130" height="34" rx="17" fill="#FFD23F"/>
    <text x="1127" y="254" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#3E2230">CAUTION</text>
    <text x="1127" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#3E2230" opacity="0.6">Canonical USDC, upgradeable.</text>
  </g>
</svg>
