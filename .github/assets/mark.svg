<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="TrustLens mark">
  <title>TrustLens</title>
  <!--
    The mark, lifted out of hero.svg where it was only reachable by reading
    the hero. A lollipop and a lens: the sweet is the product's voice, the
    crescent is the part that actually reads the contract.
  -->
  <defs>
    <linearGradient id="tl-pop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4B5C"/>
      <stop offset="1" stop-color="#FFD23F"/>
    </linearGradient>
  </defs>
  <g transform="translate(48 34)">
    <circle cx="0" cy="0" r="30" fill="url(#tl-pop)"/>
    <path d="M0,-30 A30 30 0 0 1 0,30 A15 15 0 0 1 0,0 A8 8 0 0 0 0,-16 A23 23 0 0 0 0,-30 Z" fill="#FFF6E9" opacity="0.9"/>
    <rect x="-3.5" y="26" width="7" height="34" rx="3.5" fill="#FFFFFF" opacity="0.9" stroke="#3E2230" stroke-opacity="0.14"/>
    <circle cx="-10" cy="-10" r="5.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
